            {id: 17, cat: "Home", name: "Rechargeable Desk LED Lamp with Eye Protection", price: "680 BDT", img: "https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=500", desc: "Touch dimmer, adjustable brightness, flexible folding desk light."}
        ];

        window.productsData = {};
        // ৪০০+ বিভিন্ন ক্যাটাগরির রিয়েল প্রোডাক্ট তৈরি করা হলো যাতে কোনো রিপিটেশন না থাকে
        let counter = 1;
        for(let i = 0; i < 25; i++) {
            aliExpressProducts.forEach(p => {
                window.productsData[counter] = {
                    name: `${p.name} (Batch #${counter})`,
                    price: `${parseInt(p.price.replace(/[^0-9]/g, '')) + (i*10)} BDT`,
                    img: p.img,
                    desc: `${p.desc} Category: ${p.cat}. Imported quality product.`
                };
                counter++;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            loadMyOrders();

            document.getElementById('division').addEventListener('change', function() {
                const selectedDiv = this.value;
                const districtSelect = document.getElementById('district');
                const thanaSelect = document.getElementById('thana');
                districtSelect.innerHTML = '<option value="">Select District</option>';
                thanaSelect.innerHTML = '<option value="">Select Thana / Upazila</option>';
                
                if(selectedDiv && locationData[selectedDiv]) {
                    for(let dist in locationData[selectedDiv].districts) {
                        districtSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
                    }
                }
            });

            document.getElementById('district').addEventListener('change', function() {
                const selectedDiv = document.getElementById('division').value;
                const selectedDist = this.value;
                const thanaSelect = document.getElementById('thana');
                thanaSelect.innerHTML = '<option value="">Select Thana / Upazila</option>';
                
                if(selectedDiv && selectedDist && locationData[selectedDiv].districts[selectedDist]) {
                    locationData[selectedDiv].districts[selectedDist].forEach(thana => {
                        thanaSelect.innerHTML += `<option value="${thana}">${thana}</option>`;
                    });
                }
            });
        });

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            let html = '';
            for (let id = 1; id <= 400; id++) {
                const prod = window.productsData[id];
                if(prod) {
                    html += `
                        <div class="product-card" onclick="openProductPage(${id})">
                            <img src="${prod.img}" alt="Product" loading="lazy">
                            <div class="product-info">
                                <h3>${prod.name}</h3>
                                <div class="p-price">${prod.price}</div>
                            </div>
                        </div>
                    `;
                }
            }
            grid.innerHTML = html;
        }

        window.openProductPage = function(productId) {
            const product = window.productsData[productId];
            if(!product) return;
            document.getElementById('detailImg').src = product.img;
            document.getElementById('detailTitle').innerText = product.name;
            document.getElementById('detailPrice').innerText = product.price;
            document.getElementById('detailDesc').innerText = product.desc;
            
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('myOrdersPage').style.display = 'none';
            document.getElementById('productDetailPage').style.display = 'block';
            window.scrollTo(0, 0);
        };

        window.goBackHome = function() {
            document.getElementById('productDetailPage').style.display = 'none';
            document.getElementById('successPage').style.display = 'none';
            document.getElementById('myOrdersPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('orderForm').reset();
            document.getElementById('orderForm').style.display = 'block';
            window.scrollTo(0, 0);
        };

        window.showMyOrders = function() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('productDetailPage').style.display = 'none';
            document.getElementById('myOrdersPage').style.display = 'block';
            loadMyOrders();
            window.scrollTo(0, 0);
        };

        // অর্ডার সাবমিট ও লোকাল স্টোরেজ ও ফায়ারবেসে সেভ করা
        window.handleOrderSubmit = function(event) {
            event.preventDefault();

            const orderId = 'ORD-' + Date.now();
            const orderData = {
                orderId: orderId,
                productName: document.getElementById('detailTitle').innerText,
                productPrice: document.getElementById('detailPrice').innerText,
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                division: document.getElementById('division').value,
                district: document.getElementById('district').value,
                thana: document.getElementById('thana').value,
                landmark: document.getElementById('landmark').value,
                address: document.getElementById('address').value,
                paymentMethod: document.querySelector('input[name="paymentMethod"]:checked').value,
                timestamp: Date.now(),
                orderTime: new Date().toLocaleString()
            };

            // লোকাল স্টোরেজে সেভ (২৪ ঘণ্টার মধ্যে ক্যানসেল করার সুবিধার জন্য)
            let localOrders = JSON.parse(localStorage.getItem('my_express_orders') || '[]');
            localOrders.unshift(orderData);
            localStorage.setItem('my_express_orders', JSON.stringify(localOrders));

            // ফায়ারবেসে সেভ
            const ordersRef = ref(db, 'orders');
            const newOrderRef = push(ordersRef);
            set(newOrderRef, orderData).catch(err => console.log(err));

            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('successPage').style.display = 'block';
        };

        // অর্ডার লিস্ট লোড ও ২৪ ঘণ্টা চেক করার ফাংশন
        function loadMyOrders() {
            const container = document.getElementById('ordersListContainer');
            let localOrders = JSON.parse(localStorage.getItem('my_express_orders') || '[]');
            
            if(localOrders.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888;">No orders found!</p>`;
                return;
            }

            let html = '';
            const currentTime = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;

            localOrders.forEach((ord, index) => {
                const timePassed = currentTime - ord.timestamp;
                const canCancel = timePassed < twentyFourHours;
                const hoursLeft = Math.ceil((twentyFourHours - timePassed) / (1000 * 60 * 60));

                html += `
                    <div class="order-item-card">
                        <h4>${ord.productName}</h4>
                        <p><b>Price:</b> ${ord.productPrice}</p>
                        <p><b>Customer:</b> ${ord.name} (${ord.phone})</p>
                        <p><b>Address:</b> ${ord.landmark}, ${ord.thana}, ${ord.district}</p>
                        <p><b>Time:</b> ${ord.orderTime}</p>
                        ${canCancel ? 
                            `<button class="cancel-btn" onclick="cancelOrder('${ord.orderId}')">Cancel Order (${hoursLeft}h left)</button>` : 
                            `<span class="expired-cancel">Cancellation period expired (24h passed)</span>`
                        }
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.cancelOrder = function(orderId) {
            if(confirm("Are you sure you want to cancel this order?")) {
                let localOrders = JSON.parse(localStorage.getItem('my_express_orders') || '[]');
                localOrders = localOrders.filter(o => o.orderId !== orderId);
                localStorage.setItem('my_express_orders', JSON.stringify(localOrders));
                loadMyOrders();
                alert("Order cancelled successfully.");
            }
        };
    </script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        .app-header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 2px solid #ff6600; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .app-header h1 { margin: 0; color: #ff6600; font-size: 16px; letter-spacing: 1px; }
        .nav-btn { background: #ff6600; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        .container { max-width: 600px; margin: auto; padding: 15px; }

        .section-title { font-size: 15px; color: #ff6600; margin-bottom: 12px; border-left: 4px solid #ff6600; padding-left: 8px; display: flex; justify-content: space-between; align-items: center; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; max-height: 750px; overflow-y: auto; padding-right: 5px; }

        .product-grid::-webkit-scrollbar-thumb { background: #ff6600; border-radius: 10px; }

        .product-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { border-color: #ff6600; transform: translateY(-2px); }
        .product-card img { width: 100%; height: 130px; object-fit: cover; background: #222; }
        .product-info { padding: 10px; }
        .product-info h3 { font-size: 12px; margin: 0 0 6px; color: #fff; height: 30px; overflow: hidden; }
        .product-info .p-price { font-size: 13px; color: #ff4500; font-weight: bold; }

        #productDetailPage, #myOrdersPage { display: none; }

        .detail-img-box img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 6px; }
        .detail-title { font-size: 18px; color: #fff; margin: 10px 0 5px; }
        .detail-price { font-size: 20px; color: #ff4500; font-weight: bold; margin-bottom: 10px; }
        .detail-desc { font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 20px; background: #1a1a1a; padding: 10px; border-radius: 6px; }

        .back-btn { background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .back-btn:hover { background: #444; }

        .checkout-box { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .checkout-box h3 { text-align: center; color: #ff6600; margin-top: 0; font-size: 16px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #ccc; font-size: 12px; }
        input, select, textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input:focus, select:focus, textarea:focus { border-color: #ff6600; outline: none; }

        .payment-options { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #2a2a2a; padding: 10px; border-radius: 4px; border: 1px solid #444; }
        .payment-options label { font-weight: normal; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #fff; font-size: 13px; }

        .submit-btn { width: 100%; background-color: #ff6600; color: #fff; padding: 12px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background-color: #e55c00; }

        #successPage { display: none; text-align: center; background: #1a2e1a; border: 1px solid #2e7d32; padding: 30px; border-radius: 8px; margin-top: 20px; }
        #successPage h2 { color: #4CAF50; margin-top: 0; }
        #successPage p { color: #b5e4b5; font-size: 14px; }

        .order-item-card { background: #1e1e1e; border: 1px solid #333; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
        .order-item-card h4 { margin: 0 0 6px; color: #ff6600; font-size: 14px; }
        .order-item-card p { margin: 3px 0; color: #bbb; }
        .cancel-btn { background: #d32f2f; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; font-size: 12px; }
        .cancel-btn:hover { background: #b71c1c; }
        .expired-cancel { color: #888; font-size: 11px; display: block; margin-top: 6px; }

</head>
<body>

    <header class="app-header">
        <h1>GLOBAL EXPRESS MALL</h1>
        <div>
            <button class="nav-btn" onclick="showMyOrders()">📦 My Orders</button>
            <button class="nav-btn" onclick="goBackHome()">🏠 Home</button>
        </div>
    </header>

    <div class="container">

        <!-- ১. হোমপেজ: বিভিন্ন ক্যাটাগরির পণ্য ক্যাটালগ -->
        <div id="homePage">
            <div class="section-title">
                <span>AliExpress Style Catalog</span>
                <span style="font-size: 11px; color: #888;">Watches, Gadgets, Phones, TVs & More</span>
            </div>
            <div class="product-grid" id="productGrid"></div>
        </div>

        <!-- ২. আমার অর্ডার ও ক্যান্সেলেশন সেকশন -->
        <div id="myOrdersPage">
            <button class="back-btn" onclick="goBackHome()">← Back to Catalog</button>
            <div class="section-title"><span>My Orders (24h Cancellation Window)</span></div>
            <div id="ordersListContainer"></div>
        </div>

        <!-- ৩. প্রোডাক্ট ডিটেইলস এবং অর্ডার পেজ -->
        <div id="productDetailPage">
            <button class="back-btn" onclick="goBackHome()">← Back to Catalog</button>
            
            <div class="detail-img-box">
                <img id="detailImg" src="" alt="Product Image">
            </div>
            <h2 id="detailTitle" class="detail-title"></h2>
            <div id="detailPrice" class="detail-price"></div>
            <p id="detailDesc" class="detail-desc"></p>

            <div class="checkout-box">
                <h3>Secure Checkout Form</h3>
                <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                    
                    <div class="form-group">
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="phone">Mobile Number:</label>
                        <input type="tel" id="phone" required placeholder="017xxxxxxxx">
                    </div>

                    <div class="form-group">
                        <label for="division">Select Division:</label>
                        <select id="division" required>
                            <option value="">Select Division</option>
                            <option value="Dhaka">Dhaka</option>
                            <option value="Khulna">Khulna</option>
                            <option value="Chattogram">Chattogram</option>
                            <option value="Rajshahi">Rajshahi</option>
                            <option value="Sylhet">Sylhet</option>
                            <option value="Barishal">Barishal</option>
                            <option value="Rangpur">Rangpur</option>
                            <option value="Mymensingh">Mymensingh</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="district">Select District:</label>
                        <select id="district" required>
                            <option value="">Select Division First</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="thana">Select Thana / Upazila:</label>
                        <select id="thana" required>
                            <option value="">Select District First</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="landmark">Landmark / Local Area Name:</label>
                        <input type="text" id="landmark" required placeholder="e.g. Khamarpara Bazar / Near Mosque">
                    </div>

                    <div class="form-group">
                        <label for="address">Detailed Address (Village / House / Road):</label>
                        <textarea id="address" rows="2" required placeholder="Write full street and house details"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Select Payment Method:</label>
                        <div class="payment-options">
                            <label><input type="radio" name="paymentMethod" value="Cash on Delivery" required> Cash on Delivery</label>
                            <label><input type="radio" name="paymentMethod" value="bKash"> bKash</label>
                            <label><input type="radio" name="paymentMethod" value="Nagad"> Nagad</label>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Confirm Order Now</button>
                </form>

                <!-- ৪. সফলতার পেজ -->
                <div id="successPage">
                    <h2>🎉 Order Placed Successfully!</h2>
                    <p>Your order has been recorded. You can view or cancel this order within 24 hours from the "My Orders" section.</p>
                    <button class="back-btn" style="margin-top: 15px;" onclick="goBackHome()">Continue Shopping</button>
                    <button class="nav-btn" style="margin-top: 15px; padding: 10px;" onclick="showMyOrders()">View My Orders</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
